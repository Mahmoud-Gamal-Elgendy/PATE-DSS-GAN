# CelebA-HQ 128x128 — Proof of Concept
# Start here for initial validation. ε ∈ {5, 8, 10} before trying {1, 3}.

dataset_name: celeba_hq
data_root: ./data          # used only for CIFAR-10; HF datasets cache separately
image_size: 128
num_classes: 2            # binary: female=0 / male=1 (CelebA 'Male' attribute)

# Privacy
target_epsilon: 50.0      # start here; lower after utility confirmed
delta: 1.0e-5
num_teachers: 100
num_queries: 5000         # estimated PATE queries over training
n_student_steps: 5        # post-processing updates per query

# Architecture
latent_dim: 256
base_channels_gen: 64
base_channels_disc: 64
base_channels_teacher: 32
mamba_d_model: 128
mamba_layers: 4
scan_directions: [row, col, diag]

# Training
batch_size: 4
gen_lr: 0.0002
student_lr: 0.0002
teacher_lr: 0.0002
teacher_epochs: 3
retrain_interval: 50
max_outer_steps: 10000

# Logging
log_interval: 50
save_interval: 500
output_dir: ./outputs/celeba_hq_128
checkpoint_dir: ./checkpoints/celeba_hq_128

# Misc
seed: 42
device: cuda
num_workers: 2
pin_memory: true
