# AFHQ 256x256 — Animal faces, 3 classes (cat / dog / wild)

dataset_name: afhq
image_size: 256
num_classes: 3            # cat=0, dog=1, wild=2

# Privacy
target_epsilon: 10.0
delta: 1.0e-5
num_teachers: 10
num_queries: 5000
n_student_steps: 5

# Architecture (aligned with DSS_GAN-main 256x256 AFHQ)
latent_dim: 172
base_channels_gen: 148
base_channels_disc: 64
base_channels_teacher: 32
mamba_d_model: 512
mamba_layers: 6
scan_directions: [row_fwd, col_fwd, diag_left]

# Training (aligned with DSS_GAN-main)
batch_size: 16
gen_lr: 0.00009
student_lr: 0.00003
teacher_lr: 0.0002
teacher_epochs: 3
retrain_interval: 50
max_outer_steps: 15000
optimizer_betas: [0.0, 0.99]

# Stabilisation (aligned with DSS_GAN-main)
use_ema: true
ema_decay: 0.999
use_r1: true
r1_gamma: 5.0
r1_interval: 4
use_diffaug: true
diffaug_brightness: 0.1
diffaug_contrast: 0.1
diffaug_flip_prob: 0.5
gradient_clip_gen: 10.0
gradient_clip_disc: 15.0

# Logging
log_interval: 100
save_interval: 1000
output_dir: ./outputs/afhq_256
checkpoint_dir: ./checkpoints/afhq_256

# Misc
seed: 42
device: cuda
num_workers: 4
pin_memory: true
