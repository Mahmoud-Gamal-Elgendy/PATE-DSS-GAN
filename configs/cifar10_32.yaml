# CIFAR-10 32x32 — Fast prototyping (optional, no privacy-sensitivity)
# Use this config to verify the full pipeline runs correctly before
# moving to CelebA-HQ or AFHQ.

dataset_name: cifar10
data_root: ./data/cifar10
image_size: 32
num_classes: 10

# Privacy (loose budget for fast iteration)
target_epsilon: 10.0
delta: 1.0e-5
num_teachers: 10
num_queries: 3000
n_student_steps: 5

# Architecture
latent_dim: 128
base_channels_gen: 32
base_channels_disc: 32
base_channels_teacher: 16
mamba_d_model: 128
mamba_layers: 2
scan_directions: [row, col, diag]

# Training
batch_size: 64
gen_lr: 0.0002
student_lr: 0.0002
teacher_lr: 0.0002
teacher_epochs: 2
retrain_interval: 50
max_outer_steps: 5000

# Logging
log_interval: 50
save_interval: 250
output_dir: ./outputs/cifar10_32
checkpoint_dir: ./checkpoints/cifar10_32

# Misc
seed: 42
device: cuda
num_workers: 4
pin_memory: true
